services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.6"
    env_file:
      - open5gs/open5gs.env
    privileged: true
    # TODO-ALUMNO(WEB-01): publica la WebUI solo si eliges el alta interactiva.
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.20 7777"]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        # TODO-ALUMNO(NET-01): revisa la coherencia de esta dirección con la topología requerida.
        ipv4_address: 10.54.1.2

networks:
  ran:
    name: rim-practica-ran
    ipam:
      driver: default
      config:
        # TODO-ALUMNO(NET-01): revisa la coherencia de esta subred con la topología requerida.
        - subnet: 10.54.1.0/24
